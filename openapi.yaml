components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-kume_session
      description: Sesión opaca; Secure, HttpOnly, SameSite=Strict, Path=/, sin Domain. Vence tras 8 horas de inactividad; reiniciar el backend la invalida.
  headers:
    Location:
      description: URI del recurso creado
      schema:
        type: string
        format: uri-reference

  parameters:
    KumeRequest:
      name: X-Kume-Request
      in: header
      required: true
      description: Obligatoria en escrituras, login y logout. También se valida Origin contra el origen configurado; ausente, null o distinto devuelve 403.
      schema:
        type: string
        const: "1"
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ResourceStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [active, inactive, all]
        default: active
    ExpenseStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [active, cancelled, all]
        default: active
    PaymentDateFrom:
      name: paymentDateFrom
      in: query
      schema:
        type: string
        format: date
    PaymentDateTo:
      name: paymentDateTo
      in: query
      schema:
        type: string
        format: date
    DueDateFrom:
      name: dueDateFrom
      in: query
      schema:
        type: string
        format: date
    DueDateTo:
      name: dueDateTo
      in: query
      schema:
        type: string
        format: date
    CategoryFilter:
      name: categoryId
      in: query
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffMemberId:
      name: staffMemberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkshopId:
      name: workshopId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Sesión ausente, inválida o vencida; credenciales incorrectas en login.
        Limpiar cookie si la sesión presentada ya no es válida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Origin ausente, null o distinto del origen configurado, o X-Kume-Request
        ausente o inválida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Login temporalmente limitado por cuenta o por IP; no revela si existe
        la cuenta.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: Segundos restantes hasta poder reintentar.
          schema:
            type: integer
            minimum: 1
    BadRequest:
      description: Petición malformada
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso inexistente
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflicto de estado, unicidad o asignación
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Archivo mayor a 10 MB
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: Tipo de archivo no admitido
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: Campos o reglas de negocio inválidos
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Error inesperado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BinaryFile:
      description: Contenido del archivo
      headers:
        Content-Disposition:
          description: Nombre original saneado para descarga
          schema:
            type: string
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary

  schemas:
    TimeRecordMonth:
      type: string
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
    TimeRecordImport:
      type: object
      additionalProperties: false
      required:
      - month
      properties:
        month:
          $ref: '#/components/schemas/TimeRecordMonth'
    TimeRecordBlock:
      type: object
      additionalProperties: false
      required:
      - start
      - end
      properties:
        start:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        end:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    TimeRecordContext:
      type: object
      additionalProperties: false
      required:
      - staffVersion
      - dayVersion
      - scheduleVersion
      - policyVersion
      properties:
        staffVersion:
          type: integer
          minimum: 1
        dayVersion:
          type: integer
          minimum: 0
        scheduleVersion:
          type: integer
          minimum: 0
        policyVersion:
          type: integer
          minimum: 1
    TimeRecordDay:
      type: object
      additionalProperties: false
      required:
      - date
      - context
      - state
      - planned
      - confirmed
      - marks
      - decisions
      - confirmedMinutes
      - plannedMinutes
      - differences
      properties:
        date:
          type: string
          format: date
        context:
          $ref: '#/components/schemas/TimeRecordContext'
        state:
          type: string
          enum:
          - future
          - inProgress
          - resolved
          - needsReview
          - noSchedule
          - noWork
          - afterTermination
        planned:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/TimeRecordBlock'
          - type: 'null'
        confirmed:
          type: array
          items:
            $ref: '#/components/schemas/TimeRecordBlock'
        marks:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - time
            properties:
              id:
                type: string
                format: uuid
              time:
                type: string
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/TimeRecordDecision'
        confirmedMinutes:
          type: integer
          minimum: 0
        plannedMinutes:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        differences:
          anyOf:
          - $ref: '#/components/schemas/TimeRecordDifferences'
          - type: 'null'
    TimeRecordDifferences:
      type: object
      additionalProperties: false
      required:
      - additionalMinutes
      - missingMinutes
      - balanceMinutes
      properties:
        additionalMinutes:
          type: integer
          minimum: 0
        missingMinutes:
          type: integer
          minimum: 0
        balanceMinutes:
          type: integer
    TimeRecordDecision:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - kind
        - position
        - eventId
        properties:
          kind:
            const: assign
          position:
            type: integer
            minimum: 0
            description: Índice base cero. Cada bloque aporta entrada y salida en orden.
          eventId:
            type: string
            format: uuid
      - type: object
        additionalProperties: false
        required:
        - kind
        - position
        - time
        properties:
          kind:
            const: manual
          position:
            type: integer
            minimum: 0
            description: Índice base cero. Cada bloque aporta entrada y salida en orden.
          time:
            type: string
            pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      - type: object
        additionalProperties: false
        required:
        - kind
        - startEventId
        - endEventId
        properties:
          kind:
            const: workedThroughBreak
          startEventId:
            type: string
            format: uuid
          endEventId:
            type: string
            format: uuid
      - type: object
        additionalProperties: false
        required:
        - kind
        - reason
        properties:
          kind:
            const: noWork
          reason:
            type: string
            enum:
            - leave
            - illness
            - other
    TimeRecordReview:
      type: object
      additionalProperties: false
      required:
      - context
      - decisions
      properties:
        context:
          $ref: '#/components/schemas/TimeRecordContext'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/TimeRecordDecision'
        reason:
          type: string
          maxLength: 500
    TimeRecordHistory:
      type: object
      additionalProperties: false
      required:
      - entries
      properties:
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - actor
            - time
            - operation
            - reason
            - before
            - after
            properties:
              id:
                type: string
                format: uuid
              actor:
                type: string
              time:
                type: string
                pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T([01][0-9]|2[0-3]):[0-5][0-9]$
                description: Fecha y minuto civil de America/Montevideo.
              operation:
                type: string
                enum:
                - import
                - review
                - reprocess
              reason:
                anyOf:
                - type: string
                  maxLength: 500
                - type: 'null'
              before:
                anyOf:
                - $ref: '#/components/schemas/TimeRecordDay'
                - type: 'null'
              after:
                $ref: '#/components/schemas/TimeRecordDay'
    TimeRecordSnapshot:
      type: object
      additionalProperties: false
      required:
      - month
      - importState
      - freshness
      - lastSuccessfulImport
      - days
      - summary
      properties:
        month:
          $ref: '#/components/schemas/TimeRecordMonth'
        importState:
          type: string
          enum:
          - eligible
          - needsRevalidation
          - inactive
          - unavailable
        freshness:
          type: string
          enum:
          - neverImported
          - current
          - stale
        lastSuccessfulImport:
          anyOf:
          - type: string
            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T([01][0-9]|2[0-3]):[0-5][0-9]$
            description: Fecha y minuto civil de America/Montevideo.
          - type: 'null'
        days:
          type: array
          items:
            $ref: '#/components/schemas/TimeRecordDay'
        summary:
          type: object
          additionalProperties: false
          required:
          - confirmedMinutes
          - plannedMinutes
          - differences
          - pendingDayCount
          - isPartial
          properties:
            confirmedMinutes:
              type: integer
              minimum: 0
            plannedMinutes:
              type: integer
              minimum: 0
            differences:
              $ref: '#/components/schemas/TimeRecordDifferences'
            pendingDayCount:
              type: integer
              minimum: 0
            isPartial:
              type: boolean
    LaborScheduleWeek:
      type: object
      additionalProperties: false
      required:
      - days
      properties:
        days:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - weekday
            - blocks
            properties:
              weekday:
                type: integer
                minimum: 1
                maximum: 7
                description: Día ISO de semana, lunes 1.
              blocks:
                type: array
                items:
                  $ref: '#/components/schemas/TimeRecordBlock'
    LaborScheduleException:
      type: object
      additionalProperties: false
      required:
      - date
      - reference
      - cause
      properties:
        date:
          type: string
          format: date
        reference:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - kind
            - blocks
            properties:
              kind:
                const: specialDay
              blocks:
                type: array
                items:
                  $ref: '#/components/schemas/TimeRecordBlock'
          - type: object
            additionalProperties: false
            required:
            - kind
            - reason
            properties:
              kind:
                const: justifiedAbsence
              reason:
                type: string
                enum:
                - leave
                - illness
                - holiday
                - other
        cause:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
    LaborScheduleConfiguration:
      type: object
      additionalProperties: false
      required:
      - version
      - revisions
      - exceptions
      properties:
        version:
          type: integer
          minimum: 0
        revisions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - effectiveFrom
            - week
            properties:
              effectiveFrom:
                type: string
                format: date
              week:
                $ref: '#/components/schemas/LaborScheduleWeek'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/LaborScheduleException'
    LaborScheduleDraft:
      type: object
      additionalProperties: false
      required:
      - version
      - change
      properties:
        version:
          type: integer
          minimum: 0
        change:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - kind
            - effectiveFrom
            - week
            properties:
              kind:
                const: weekly
              effectiveFrom:
                type: string
                format: date
              week:
                $ref: '#/components/schemas/LaborScheduleWeek'
          - type: object
            additionalProperties: false
            required:
            - kind
            - exception
            properties:
              kind:
                const: exception
              exception:
                $ref: '#/components/schemas/LaborScheduleException'
    TimeRecordPolicyRevision:
      type: object
      additionalProperties: false
      required:
      - effectiveFrom
      - marginMinutes
      properties:
        effectiveFrom:
          type: string
          format: date
        marginMinutes:
          type: integer
          minimum: 0
    TimeRecordPolicy:
      type: object
      additionalProperties: false
      required:
      - version
      - revisions
      properties:
        version:
          type: integer
          minimum: 1
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/TimeRecordPolicyRevision'
    TimeRecordPolicyDraft:
      type: object
      additionalProperties: false
      required:
      - version
      - revision
      properties:
        version:
          type: integer
          minimum: 1
        revision:
          $ref: '#/components/schemas/TimeRecordPolicyRevision'
    TimeRecordChangePreview:
      type: object
      additionalProperties: false
      required:
      - previewId
      - expiresAt
      - affected
      properties:
        previewId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        affected:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - staffMemberId
            - date
            - needsReview
            properties:
              staffMemberId:
                type: string
                format: uuid
              date:
                type: string
                format: date
              needsReview:
                type: boolean
    TimeRecordChangeConfirmation:
      type: object
      additionalProperties: false
      required:
      - previewId
      properties:
        previewId:
          type: string
          format: uuid

    WorkshiftObservation:
      type: object
      additionalProperties: false
      required: []
      properties:
        code:
          type:
            - string
            - "null"
          maxLength: 256
        name:
          type:
            - string
            - "null"
          maxLength: 256
        type:
          type:
            - string
            - "null"
          maxLength: 256
    WorkshiftReference:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - external
        - localStartTime
        - localEndTime
        - version
      properties:
        id:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        label:
          type: string
        external:
          $ref: "#/components/schemas/WorkshiftObservation"
        localStartTime:
          anyOf:
            - type: string
              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
            - type: "null"
        localEndTime:
          anyOf:
            - type: string
              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
            - type: "null"
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
    WorkshiftHoursChange:
      type: object
      additionalProperties: false
      required:
        - localStartTime
        - localEndTime
        - version
      properties:
        localStartTime:
          anyOf:
            - type: string
              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
            - type: "null"
        localEndTime:
          anyOf:
            - type: string
              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
            - type: "null"
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
    WorkshiftPreviewRow:
      type: object
      additionalProperties: false
      required:
        - id
        - observation
        - count
        - duplicateCode
        - status
      properties:
        id:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        observation:
          $ref: "#/components/schemas/WorkshiftObservation"
        count:
          type: integer
          minimum: 1
          maximum: 2147483647
        duplicateCode:
          type: boolean
        status:
          type: string
          enum:
            - indistinguishable
            - incomplete
            - observed
            - review
            - new
        referenceId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    WorkshiftImportPreview:
      type: object
      additionalProperties: false
      required:
        - id
        - queriedAt
        - expiresAt
        - rows
        - missingReferenceIds
      properties:
        id:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        queriedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        rows:
          type: array
          items:
