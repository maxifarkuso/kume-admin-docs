          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        nic:
          type: string
          minLength: 1
          maxLength: 20
        phone:
          type: string
          minLength: 1
          maxLength: 30
        birthDate:
          type: [string, "null"]
          format: date
        email:
          type: [string, "null"]
          format: email
          maxLength: 254
        address:
          type: [string, "null"]
          maxLength: 500
        startDate:
          type: [string, "null"]
          format: date
        role:
          $ref: "#/components/schemas/Role"
    StaffMemberSummary:
      type: object
