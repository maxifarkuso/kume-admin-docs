openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: KUME Administrative API
  version: 1.0.0
  description: >-
    Contrato funcional de KUME, con API Fastify desplegada inicialmente en Oracle
    Cloud Always Free y posible migración completa a intranet. Los nombres técnicos
    están en inglés y los textos administrables permanecen en español.
    Alcance confirmado el 2 de noviembre de 2026: Maxi y Vicky con los mismos
    permisos, hashes de contraseñas individuales en secrets y sin tabla de usuarios.
    Cambios manuales de contraseña, sin recuperación por correo; cierre manual,
    expiración tras 8 horas de inactividad y límites temporales por cuenta y por IP.
    Sesiones en memoria de una instancia Fastify; reiniciar exige nuevo login.
    Frontend y API bajo un mismo origen HTTPS. Contrato de autenticación definido;
    Cambio de contraseña mediante secrets y reinicio, cerrando todas las sesiones.
    Pausa de 15 minutos tras 5 fallos por cuenta o 20 por IP en 15 minutos.
    Implementación y verificación pendientes antes del piloto.
servers:
  - url: http://localhost:3000
    description: Referencia de desarrollo local; la URL HTTPS cloud o de intranet se definirá al desplegar
security:
  - SessionCookie: []
tags:
  - name: System
  - name: Authentication
  - name: Categories
  - name: Expenses
  - name: Staff members
  - name: Time records
  - name: Assignments
  - name: Courses
  - name: Workshops

  - name: Workshifts

paths:
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Iniciar sesión
      operationId: login
      security: []
      description: Valida Origin y X-Kume-Request. Rota la sesión del navegador al autenticar.
        Credenciales incorrectas no revelan si existe el usuario. Cache-Control no-store
        en todas las respuestas. Ventana móvil de 15 minutos; 5 fallos por cuenta
        o 20 por IP activan una pausa de 15 minutos. El fallo que alcanza el umbral
        y las solicitudes durante la pausa devuelven 429 con Retry-After; las
        solicitudes rechazadas no prolongan la pausa.
      parameters:
      - $ref: '#/components/parameters/KumeRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión creada; token solo en cookie.
          headers:
            Cache-Control: &id001
              description: Impide almacenar respuestas de autenticación.
              schema:
                type: string
                const: no-store
            Set-Cookie: &id002
              description: Cookie de sesión; Secure, HttpOnly, SameSite=Strict, Path=/,
                sin Domain ni vencimiento persistente. Logout la elimina usando Max-Age=0.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/session:
    get:
      tags:
      - Authentication
      summary: Consultar sesión sin renovar actividad
      operationId: getSession
      description: No actualiza lastActivityAt. Respuesta no-store; sesión ausente,
        vencida o invalidada devuelve 401 y limpia cookie.
      responses:
        '200':
          description: Sesión vigente; mismos permisos para ambas cuentas.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Cerrar sesión
      operationId: logout
      security: []
      description: Valida Origin y X-Kume-Request. Elimina sesión presentada y limpia
        cookie. Idempotente sin sesión o con sesión inválida; no cierra otras sesiones
        del usuario.
      parameters:
      - $ref: '#/components/parameters/KumeRequest'
      responses:
        '204':
          description: Sesión invalidada y cookie eliminada.
          headers:
            Cache-Control: *id001
            Set-Cookie: *id002
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      security: []
      description: Salud interna para Compose; el proxy público no expone esta ruta.
      tags: [System]
      summary: Comprobar API y PostgreSQL
      operationId: getHealth
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Dependencia no disponible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /openapi.json:
    get:
      tags: [System]
      summary: Obtener el contrato OpenAPI servido por la aplicación
      operationId: getOpenApiDocument
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Documento OpenAPI
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /documentation:
    get:
      tags: [System]
      summary: Abrir la interfaz Swagger local
      operationId: getDocumentation
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Interfaz HTML
          content:
            text/html:
              schema:
                type: string

  /api/v1/categories:
    get:
      tags: [Categories]
      summary: Listar rubros
      operationId: listCategories
      parameters:
        - $ref: "#/components/parameters/ResourceStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Página de rubros ordenada por nombre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Categories]
      summary: Crear rubro
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      parameters:
        - $ref: "#/components/parameters/KumeRequest"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "201":
          description: Rubro creado
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [Categories]
      summary: Consultar rubro
      operationId: getCategory
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Rubro encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Categories]
      summary: Editar rubro
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
      parameters:
        - $ref: "#/components/parameters/KumeRequest"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Rubro actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/categories/{categoryId}/deactivation:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      tags: [Categories]
      summary: Desactivar rubro
      operationId: deactivateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogVersion"
      parameters:
        - $ref: "#/components/parameters/KumeRequest"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: Rubro desactivado
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Categories]
      summary: Reactivar rubro
      operationId: reactivateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogVersion"
      parameters:
        - $ref: "#/components/parameters/KumeRequest"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: Rubro reactivado
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/expenses:
    get:
      tags: [Expenses]
      summary: Listar y totalizar gastos
      operationId: listExpenses
      parameters:
        - $ref: "#/components/parameters/PaymentDateFrom"
        - $ref: "#/components/parameters/PaymentDateTo"
        - $ref: "#/components/parameters/DueDateFrom"
        - $ref: "#/components/parameters/DueDateTo"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/ExpenseStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Página de gastos y total del filtro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Expenses]
      summary: Crear gasto con comprobante opcional
      operationId: createExpense
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: "#/components/schemas/ExpenseCreate"
                receipt:
                  type: string
                  format: binary
            encoding:
              data:
                contentType: application/json
      parameters:
        - $ref: "#/components/parameters/KumeRequest"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "201":
          description: Gasto y comprobante creados
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/expenses/export.csv:
    get:
      tags: [Expenses]
      summary: Exportar gastos filtrados
      operationId: exportExpenses
      parameters:
        - $ref: "#/components/parameters/PaymentDateFrom"
        - $ref: "#/components/parameters/PaymentDateTo"
        - $ref: "#/components/parameters/DueDateFrom"
        - $ref: "#/components/parameters/DueDateTo"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/ExpenseStatus"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: CSV UTF-8 con BOM y formato RFC 4180
          headers:
            Content-Disposition:
              description: Nombre sugerido del archivo
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/expenses/{expenseId}:
    parameters:
      - $ref: "#/components/parameters/ExpenseId"
    get:
      tags: [Expenses]
      summary: Consultar gasto
      operationId: getExpense
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Gasto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Expenses]
      summary: Editar gasto activo
      operationId: updateExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpensePatch"
      parameters:
        - $ref: "#/components/parameters/KumeRequest"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Gasto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/expenses/{expenseId}/cancellation:
    parameters:
      - $ref: "#/components/parameters/ExpenseId"
    post:
      tags: [Expenses]
      summary: Anular gasto
      operationId: cancelExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogVersion"
      parameters:
        - $ref: "#/components/parameters/KumeRequest"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: Gasto anulado
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Expenses]
      summary: Restaurar gasto anulado
      operationId: restoreExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogVersion"
      parameters:
        - $ref: "#/components/parameters/KumeRequest"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: Gasto restaurado
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/expenses/{expenseId}/receipt:
    parameters:
      - $ref: "#/components/parameters/ExpenseId"
    put:
      tags: [Expenses]
      summary: Reemplazar comprobante de un gasto activo
      operationId: replaceReceipt
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [receipt, version]
              properties:
                version:
                  type: integer
                  minimum: 1
                receipt:
                  type: string
                  format: binary
      parameters:
        - $ref: "#/components/parameters/KumeRequest"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Metadatos del comprobante nuevo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMetadata"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/expenses/{expenseId}/receipt/content:
    parameters:
      - $ref: "#/components/parameters/ExpenseId"
    get:
      tags: [Expenses]
      summary: Descargar comprobante
      operationId: downloadReceipt
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          $ref: "#/components/responses/BinaryFile"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/staff-members:
    get:
      tags: [Staff members]
      summary: Listar y buscar personal
      operationId: listStaffMembers
      parameters:
        - name: search
          in: query
          description: Coincidencia parcial en nombre, apellido o cédula
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/ResourceStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Página de personal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMemberPage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Staff members]
      summary: Crear ficha de personal
      operationId: createStaffMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffMemberCreate"
      parameters:
        - $ref: "#/components/parameters/KumeRequest"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "201":
          description: Ficha creada
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/staff-members/{staffMemberId}:
    parameters:
      - $ref: "#/components/parameters/StaffMemberId"
    get:
      tags: [Staff members]
      summary: Consultar ficha, asignaciones y documentos
      operationId: getStaffMember
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Ficha encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMemberDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Staff members]
      summary: Editar ficha activa
      operationId: updateStaffMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffMemberPatch"
      parameters:
        - $ref: "#/components/parameters/KumeRequest"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Ficha actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/staff-members/{staffMemberId}/time-records:
    parameters:
    - $ref: '#/components/parameters/StaffMemberId'
    get:
      tags:
      - Time records
      operationId: getStaffTimeRecords
      parameters:
      - name: month
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/TimeRecordMonth'
      responses:
        '200':
          description: Resultado de Registro de horas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRecordSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/staff-members/{staffMemberId}/time-record-imports:
    parameters:
    - $ref: '#/components/parameters/StaffMemberId'
    post:
      tags:
      - Time records
      operationId: importStaffTimeRecords
      parameters:
      - $ref: '#/components/parameters/KumeRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeRecordImport'
      responses:
        '200':
          description: Resultado de Registro de horas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRecordSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: Respuesta de Clock inválida o cobertura insuficiente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Actualización no disponible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: Tiempo de espera de Clock agotado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/staff-members/{staffMemberId}/time-records/{date}:
    parameters:
    - $ref: '#/components/parameters/StaffMemberId'
    - name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    put:
      tags:
      - Time records
      operationId: reviewStaffTimeRecord
      parameters:
      - $ref: '#/components/parameters/KumeRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeRecordReview'
      responses:
        '200':
          description: Resultado de Registro de horas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRecordDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/staff-members/{staffMemberId}/time-records/{date}/history:
    parameters:
    - $ref: '#/components/parameters/StaffMemberId'
    - name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    get:
      tags:
      - Time records
      operationId: getStaffTimeRecordHistory
      responses:
        '200':
          description: Resultado de Registro de horas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRecordHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/staff-members/{staffMemberId}/labor-schedules:
    parameters:
    - $ref: '#/components/parameters/StaffMemberId'
    get:
      tags:
      - Time records
      operationId: getStaffLaborSchedules
      responses:
        '200':
          description: Resultado de Registro de horas
          content:
            application/json:
              schema:
