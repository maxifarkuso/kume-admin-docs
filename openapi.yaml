  responses:
    BadRequest:
      description: Petición malformada
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso inexistente
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflicto de estado, unicidad o asignación
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Archivo mayor a 10 MB
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: Tipo de archivo no admitido
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: Campos o reglas de negocio inválidos
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Error inesperado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BinaryFile:
      description: Contenido del archivo
      headers:
        Content-Disposition:
          description: Nombre original saneado para descarga
          schema:
            type: string
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary

  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          const: ok
        database:
          type: string
          const: ok

    PageFields:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    TimestampFields:
      type: object
      required: [createdAt, updatedAt]
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Category:
      allOf:
        - $ref: "#/components/schemas/TimestampFields"
        - type: object
          required: [id, name, isActive]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              minLength: 1
              maxLength: 100
            isActive:
              type: boolean
    CategorySummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
    CategoryCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    CategoryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    CategoryPage:
      allOf:
        - $ref: "#/components/schemas/PageFields"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Category"

    FileMetadata:
      type: object
      required: [id, originalFilename, mimeType, sizeBytes, sha256, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        originalFilename:
          type: string
          maxLength: 255
        mimeType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ExpenseCreate:
      type: object
      additionalProperties: false
      required: [paymentDate, amount, currency, payee, description, categoryId]
      properties:
        paymentDate:
          type: string
          format: date
        amount:
          type: string
          pattern: "^[0-9]{1,10}\\.[0-9]{2}$"
        currency:
          type: string
          const: UYU
        payee:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 500
        categoryId:
          type: string
          format: uuid
    ExpensePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        paymentDate:
          type: string
          format: date
        amount:
          type: string
          pattern: "^[0-9]{1,10}\\.[0-9]{2}$"
        currency:
          type: string
          const: UYU
        payee:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 500
        categoryId:
          type: string
          format: uuid
    Expense:
      allOf:
        - $ref: "#/components/schemas/TimestampFields"
        - type: object
          required:
            - id
            - paymentDate
            - amount
            - currency
            - payee
            - description
            - isCancelled
            - category
            - receipt
          properties:
            id:
              type: string
              format: uuid
            paymentDate:
              type: string
              format: date
            amount:
              type: string
              pattern: "^[0-9]{1,10}\\.[0-9]{2}$"
            currency:
              type: string
              const: UYU
            payee:
              type: string
            description:
              type: string
            isCancelled:
              type: boolean
            category:
              $ref: "#/components/schemas/CategorySummary"
            receipt:
              $ref: "#/components/schemas/FileMetadata"
    ExpenseSummary:
      type: object
      required: [totalAmount, currency]
      properties:
        totalAmount:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        currency:
          type: string
          const: UYU
    ExpensePage:
      allOf:
        - $ref: "#/components/schemas/PageFields"
        - type: object
          required: [items, summary]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Expense"
            summary:
              $ref: "#/components/schemas/ExpenseSummary"

    Role:
