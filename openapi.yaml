openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: KUME Administrative API
  version: 1.0.0
  description: >-
    Contrato del prototipo administrativo local de KUME. Los nombres técnicos
    están en inglés y los textos administrables permanecen en español.
servers:
  - url: http://localhost:3000
    description: Instalación local
tags:
  - name: System
  - name: Categories
  - name: Expenses
  - name: Staff members
  - name: Assignments
  - name: Courses
  - name: Workshops

paths:
  /health:
    get:
      tags: [System]
      summary: Comprobar API y PostgreSQL
      operationId: getHealth
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Dependencia no disponible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /openapi.json:
    get:
      tags: [System]
      summary: Obtener el contrato OpenAPI servido por la aplicación
      operationId: getOpenApiDocument
      responses:
        "200":
          description: Documento OpenAPI
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /documentation:
    get:
      tags: [System]
      summary: Abrir la interfaz Swagger local
      operationId: getDocumentation
      responses:
        "200":
          description: Interfaz HTML
          content:
            text/html:
              schema:
                type: string

  /api/v1/categories:
    get:
      tags: [Categories]
      summary: Listar rubros
      operationId: listCategories
      parameters:
        - $ref: "#/components/parameters/ResourceStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de rubros ordenada por nombre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Categories]
      summary: Crear rubro
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Rubro creado
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [Categories]
      summary: Consultar rubro
      operationId: getCategory
      responses:
        "200":
          description: Rubro encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Categories]
      summary: Editar rubro
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
      responses:
        "200":
          description: Rubro actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/categories/{categoryId}/deactivation:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      tags: [Categories]
      summary: Desactivar rubro
      operationId: deactivateCategory
      responses:
        "204":
          description: Rubro desactivado
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Categories]
      summary: Reactivar rubro
      operationId: reactivateCategory
      responses:
        "204":
          description: Rubro reactivado
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/expenses:
    get:
      tags: [Expenses]
      summary: Listar y totalizar gastos
      operationId: listExpenses
      parameters:
        - $ref: "#/components/parameters/PaymentDateFrom"
        - $ref: "#/components/parameters/PaymentDateTo"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/ExpenseStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de gastos y total del filtro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Expenses]
      summary: Crear gasto con comprobante obligatorio
      operationId: createExpense
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [data, receipt]
              properties:
                data:
                  $ref: "#/components/schemas/ExpenseCreate"
                receipt:
                  type: string
                  format: binary
            encoding:
              data:
                contentType: application/json
      responses:
        "201":
          description: Gasto y comprobante creados
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/expenses/export.csv:
    get:
      tags: [Expenses]
      summary: Exportar gastos filtrados
      operationId: exportExpenses
      parameters:
        - $ref: "#/components/parameters/PaymentDateFrom"
        - $ref: "#/components/parameters/PaymentDateTo"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/ExpenseStatus"
      responses:
        "200":
          description: CSV UTF-8 con BOM y formato RFC 4180
          headers:
            Content-Disposition:
              description: Nombre sugerido del archivo
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/expenses/{expenseId}:
    parameters:
      - $ref: "#/components/parameters/ExpenseId"
    get:
      tags: [Expenses]
      summary: Consultar gasto
      operationId: getExpense
      responses:
        "200":
          description: Gasto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Expenses]
      summary: Editar gasto activo
      operationId: updateExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpensePatch"
      responses:
        "200":
          description: Gasto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/expenses/{expenseId}/cancellation:
    parameters:
      - $ref: "#/components/parameters/ExpenseId"
    post:
      tags: [Expenses]
      summary: Anular gasto
      operationId: cancelExpense
      responses:
        "204":
          description: Gasto anulado
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Expenses]
      summary: Restaurar gasto anulado
      operationId: restoreExpense
      responses:
        "204":
          description: Gasto restaurado
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/expenses/{expenseId}/receipt:
    parameters:
      - $ref: "#/components/parameters/ExpenseId"
    put:
      tags: [Expenses]
      summary: Reemplazar comprobante de un gasto activo
      operationId: replaceReceipt
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [receipt]
              properties:
                receipt:
                  type: string
                  format: binary
      responses:
        "200":
          description: Metadatos del comprobante nuevo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMetadata"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/expenses/{expenseId}/receipt/content:
    parameters:
      - $ref: "#/components/parameters/ExpenseId"
    get:
      tags: [Expenses]
      summary: Descargar comprobante
      operationId: downloadReceipt
      responses:
        "200":
          $ref: "#/components/responses/BinaryFile"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/staff-members:
    get:
      tags: [Staff members]
      summary: Listar y buscar personal
      operationId: listStaffMembers
      parameters:
        - name: search
          in: query
          description: Coincidencia parcial en nombre, apellido o cédula
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/ResourceStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de personal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMemberPage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Staff members]
      summary: Crear ficha de personal
      operationId: createStaffMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffMemberCreate"
      responses:
        "201":
          description: Ficha creada
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/staff-members/{staffMemberId}:
    parameters:
      - $ref: "#/components/parameters/StaffMemberId"
    get:
      tags: [Staff members]
      summary: Consultar ficha, asignaciones y documentos
      operationId: getStaffMember
      responses:
        "200":
          description: Ficha encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMemberDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Staff members]
      summary: Editar ficha activa
      operationId: updateStaffMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffMemberPatch"
      responses:
        "200":
          description: Ficha actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/staff-members/{staffMemberId}/deactivation:
    parameters:
      - $ref: "#/components/parameters/StaffMemberId"
    post:
      tags: [Staff members]
      summary: Inactivar personal y retirar sus asignaciones
      operationId: deactivateStaffMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffDeactivation"
      responses:
        "204":
          description: Ficha inactivada
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Staff members]
      summary: Reactivar personal sin restaurar asignaciones
      operationId: reactivateStaffMember
      responses:
        "204":
          description: Ficha reactivada y fecha de egreso eliminada
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/staff-members/{staffMemberId}/documents:
    parameters:
      - $ref: "#/components/parameters/StaffMemberId"
    get:
      tags: [Staff members]
      summary: Listar documentos del personal
      operationId: listStaffDocuments
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de documentos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDocumentPage"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Staff members]
      summary: Subir documento a una ficha activa
      operationId: createStaffDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Documento creado
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDocument"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/staff-members/{staffMemberId}/documents/{documentId}/content:
    parameters:
      - $ref: "#/components/parameters/StaffMemberId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Staff members]
      summary: Descargar documento
      operationId: downloadStaffDocument
      responses:
        "200":
          $ref: "#/components/responses/BinaryFile"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/staff-members/{staffMemberId}/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/StaffMemberId"
      - $ref: "#/components/parameters/DocumentId"
    delete:
      tags: [Staff members]
      summary: Eliminar documento de una ficha activa
      operationId: deleteStaffDocument
      responses:
        "204":
          description: Registro y archivo eliminados
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/assignments:
    get:
      tags: [Assignments]
      summary: Listar asignaciones actuales
      operationId: listAssignments
      parameters:
        - name: staffMemberId
          in: query
          schema:
            type: string
            format: uuid
        - name: targetType
          in: query
          schema:
            $ref: "#/components/schemas/AssignmentTargetType"
        - name: targetId
          in: query
          schema:
            type: string
            format: uuid
        - name: shift
          in: query
          schema:
            $ref: "#/components/schemas/Shift"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de asignaciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Assignments]
      summary: Crear asignación
      operationId: createAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentWrite"
      responses:
        "201":
          description: Asignación creada
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/assignments/{assignmentId}:
    parameters:
      - $ref: "#/components/parameters/AssignmentId"
    get:
      tags: [Assignments]
      summary: Consultar asignación
      operationId: getAssignment
      responses:
        "200":
          description: Asignación encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Assignments]
      summary: Reemplazar asignación actual
      operationId: replaceAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentWrite"
      responses:
        "200":
          description: Asignación actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Assignments]
      summary: Retirar asignación sin historial
      operationId: deleteAssignment
      responses:
        "204":
          description: Asignación retirada
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/courses:
    get:
      tags: [Courses]
      summary: Listar y buscar cursos
      operationId: listCourses
      parameters:
        - name: search
          in: query
          description: Coincidencia en nombre formal o interno
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/ResourceStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de cursos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Courses]
      summary: Crear curso
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreate"
      responses:
        "201":
          description: Curso creado
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/courses/{courseId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Courses]
      summary: Consultar curso
      operationId: getCourse
      responses:
        "200":
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Courses]
      summary: Editar curso
      operationId: updateCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePatch"
      responses:
        "200":
          description: Curso actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/courses/{courseId}/deactivation:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      tags: [Courses]
      summary: Desactivar curso sin asignaciones
      operationId: deactivateCourse
      responses:
        "204":
          description: Curso desactivado
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Courses]
      summary: Reactivar curso
      operationId: reactivateCourse
      responses:
        "204":
          description: Curso reactivado
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workshops:
    get:
      tags: [Workshops]
      summary: Listar talleres
      operationId: listWorkshops
      parameters:
        - $ref: "#/components/parameters/ResourceStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de talleres
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopPage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Workshops]
      summary: Crear taller
      operationId: createWorkshop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopCreate"
      responses:
        "201":
          description: Taller creado
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workshop"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/workshops/{workshopId}:
    parameters:
      - $ref: "#/components/parameters/WorkshopId"
    get:
      tags: [Workshops]
      summary: Consultar taller
      operationId: getWorkshop
      responses:
        "200":
          description: Taller encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workshop"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Workshops]
      summary: Editar taller
      operationId: updateWorkshop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopPatch"
      responses:
        "200":
          description: Taller actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workshop"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/workshops/{workshopId}/deactivation:
    parameters:
      - $ref: "#/components/parameters/WorkshopId"
    post:
      tags: [Workshops]
      summary: Desactivar taller sin asignaciones
      operationId: deactivateWorkshop
      responses:
        "204":
          description: Taller desactivado
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Workshops]
      summary: Reactivar taller
      operationId: reactivateWorkshop
      responses:
        "204":
          description: Taller reactivado
        "404":
          $ref: "#/components/responses/NotFound"

components:
  headers:
    Location:
      description: URI del recurso creado
      schema:
        type: string
        format: uri-reference

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
